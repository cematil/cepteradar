# Her push'ta CepteRadar Android APK ve AAB paketlerini üretir.
# Üretilen dosyalar, Actions sekmesinden "cepteradar-aab" ve "cepteradar-apk" adlarıyla indirilir.
name: CepteRadar Android Derleme

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Android projesini hazırla
        run: npm run android:hazirla

      # APK (Test için) ve AAB (Google Play Store için) derleme adımı
      - name: APK ve AAB derle
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          ./gradlew bundleRelease --no-daemon

      # Google Play Console yüklemesi için .aab dosyası
      - uses: actions/upload-artifact@v4
        with:
          name: cepteradar-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Telefonda anlık test etmek için .apk dosyası
      - uses: actions/upload-artifact@v4
        with:
          name: cepteradar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
