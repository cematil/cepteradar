# main dalına her push'ta siteyi GitHub Pages'e yayınlar:
#   https://cematil.github.io/cepteradar/
# İlk kurulum (bir kez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Web Sitesi (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site dosyalarını hazırla
        run: node scripts/www-hazirla.mjs --web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
