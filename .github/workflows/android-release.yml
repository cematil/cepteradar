# Google Play'e yüklenecek imzalı Android App Bundle (.aab) üretir.
# Elle çalıştırılır: Actions → "Android Play Sürümü" → Run workflow.
# Gerekli depo gizli değerleri (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   yükleme anahtarı (.jks) dosyasının base64 hali
#   ANDROID_KEYSTORE_PASSWORD anahtar deposu şifresi
#   ANDROID_KEY_ALIAS         anahtar adı (ör. cepteradar)
#   ANDROID_KEY_PASSWORD      anahtar şifresi
# Sürüm kodu her çalıştırmada artar (çalıştırma numarası); sürüm adı package.json'daki "version".
name: Android Play Sürümü

on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gizli değerleri kontrol et
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Eksik gizli değer(ler):$missing — Settings → Secrets and variables → Actions bölümünden ekleyin."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Yükleme anahtarını yerleştir
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Android projesini hazırla (sürüm + imza)
        run: npm run android:hazirla
        env:
          CEPTE_VERSION_CODE: ${{ github.run_number }}
          CEPTE_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks

      - name: İmzalı App Bundle derle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
        env:
          CEPTE_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          CEPTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CEPTE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CEPTE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Anahtar dosyasını sil
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: cepteradar-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
